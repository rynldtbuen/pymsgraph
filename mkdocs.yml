site_name: pymsgraph
site_description: Python client for Microsoft Graph
site_url: https://rynldtbuen.github.io/pymsgraph/
repo_url: https://github.com/rynldtbuen/pymsgraph
repo_name: rynldtbuen/pymsgraph

theme:
  name: material

extra_css:
  - stylesheets/api.css

nav:
  - Quickstart: index.md
  - QuerySet: queryset.md
  - Models:
      - User: user-model.md
      - Group: group-model.md
      - Site: site-model.md
      - Drive: drive-model.md
      - List: list-model.md
      - Subscribed SKU: subscribed-sku-model.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths:
            - src
          options:
            show_source: false
            inherited_members: false
            show_if_no_docstring: true
            show_root_heading: true
            show_root_full_path: false
            docstring_section_style: list
            line_length: 80
            heading_level: 2
            show_category_heading: true

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
